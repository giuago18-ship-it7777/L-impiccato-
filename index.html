<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La missione segreta</title><style>body{font-family:system-ui;text-align:center;background:linear-gradient(#dff4ff,#fff);color:#17334e;margin:0;padding:24px}main{max-width:600px;margin:auto}h1{font-size:30px}.word{font-size:clamp(18px,5vw,30px);font-weight:800;letter-spacing:3px;line-height:2;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}button{border:0;border-radius:12px;padding:12px 0;font-size:20px;font-weight:700;background:#368bd9;color:white}button:disabled{background:#a8b6c4}.card{background:white;padding:20px;border-radius:20px;box-shadow:0 8px 25px #b7d5e5}#drawing{font-family:monospace;white-space:pre;font-size:19px;line-height:1.15}#status{font-size:23px;font-weight:bold}</style></head><body><main><h1>❄️ Missione segreta 🏰</h1><p>Gabriel e Manuel, riuscite a scoprire la frase misteriosa?</p><div class="card"><p>Indizio: un luogo magico tra neve e ghiaccio</p><div id="word" class="word"></div><pre id="drawing"></pre><p id="tries"></p><div id="keys" class="keys"></div><p id="status"></p></div></main><script>const secret="IL CASTELLO DI FROZEN",alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ",max=8;let chosen=new Set(),errors=0;const key="missione-frozen-v1-completata";const word=document.querySelector("#word"),keys=document.querySelector("#keys"),drawing=document.querySelector("#drawing"),tries=document.querySelector("#tries"),status=document.querySelector("#status");function finished(msg){keys.replaceChildren();status.textContent=msg;localStorage.setItem(key,"1");}function render(){word.textContent=[...secret].map(c=>c===" "?"   ":chosen.has(c)?c:"_").join(" ");tries.textContent="Errori: "+errors+" / "+max;drawing.textContent=["","  O","  O\n  |","  O\n /|","  O\n /|\\","  O\n /|\\\n /","  O\n /|\\\n / \\","  O\n /|\\\n / \\","  O\n /|\\\n / \\"][errors];if([...secret].every(c=>c===" "||chosen.has(c))){word.textContent=secret;finished("🎉 Bravissimi! Missione completata!");setTimeout(()=>{word.textContent="❄️";status.textContent="🔒 Missione completata!"},5000)}else if(errors>=max){word.textContent=secret;finished("Missione terminata! La frase era: "+secret)}}if(localStorage.getItem(key)==="1"){word.textContent="❄️";finished("🔒 Missione completata!")}else{for(const c of alphabet){const b=document.createElement("button");b.textContent=c;b.onclick=()=>{b.disabled=true;chosen.add(c);if(!secret.includes(c))errors++;render()};keys.append(b)}render()}</script></body></html>
